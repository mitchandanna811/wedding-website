<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Anna and Mitch</title>

<link
    rel="stylesheet"
    href="https://use.typekit.net/anp5gec.css"
>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}


body {
    background: #000;
}


/* =========================================================
   HERO
   ========================================================= */

.hero {
    position: relative;

    width: 100vw;
    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   BACKGROUND VIDEO
   ========================================================= */

.hero-video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    opacity: 0;

    animation:
        videoFadeIn
        2.5s ease
        forwards;
}


/* =========================================================
   MOBILE WEBP FALLBACK
   ========================================================= */

.mobile-background {
    display: none;

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    opacity: 0;

    animation:
        mobileFadeIn
        1.5s ease
        forwards;
}


/* =========================================================
   CINEMATIC OVERLAY
   ========================================================= */

.overlay {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.12) 0%,
            rgba(0,0,0,.07) 45%,
            rgba(0,0,0,.20) 100%
        );

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content {
    position: absolute;

    z-index: 2;

    left: 50%;
    top: 48%;

    transform:
        translate(
            -50%,
            -50%
        );

    width: 90%;

    text-align: center;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    opacity: 0;

    animation:
        contentFadeIn
        1.8s ease
        1.2s forwards;
}


/* =========================================================
   NAMES
   ========================================================= */

.names {
    font-family:
        "aunt-mildred-mvb",
        sans-serif;

    font-weight: 400;

    font-style: normal;

    font-size:
        clamp(
            3.5rem,
            6vw,
            6.5rem
        );

    line-height: 1;

    letter-spacing: .01em;

    text-shadow:
        0 2px 16px
        rgba(0,0,0,.22);

    margin-bottom: 20px;
}


/* =========================================================
   DATE
   ========================================================= */

.date {
    font-family:
        "legitima",
        serif;

    font-weight: 500;

    font-style: normal;

    font-size:
        clamp(
            1rem,
            1.35vw,
            1.35rem
        );

    letter-spacing: .18em;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.22);

    margin-bottom: 38px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons {
    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 13px;

    width: 100%;
}


.button {
    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 330px;

    padding: 13px 22px;

    color: white;

    text-decoration: none;

    font-family:
        "legitima",
        serif;

    font-weight: 500;

    font-style: normal;

    font-size: .82rem;

    letter-spacing: .16em;

    text-transform: uppercase;

    text-align: center;

    white-space: nowrap;

    border:
        1px solid
        rgba(255,255,255,.65);

    background:
        rgba(0,0,0,.08);

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.20);

    transition:
        background .4s ease,
        border-color .4s ease,
        transform .4s ease;
}


.button::after {
    content: "";

    position: absolute;

    left: 50%;

    bottom: -1px;

    width: 0;

    height: 1px;

    background: white;

    transform:
        translateX(-50%);

    transition:
        width .4s ease;
}


.button:hover {
    background:
        rgba(255,255,255,.13);

    border-color:
        rgba(255,255,255,.95);

    transform:
        translateY(-2px);
}


.button:hover::after {
    width: 70%;
}


/* =========================================================
   LOCATION
   ========================================================= */

.location {
    position: absolute;

    z-index: 2;

    left: 50%;

    bottom: 7%;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

    color: white;

    opacity: 0;

    animation:
        locationFadeIn
        1.8s ease
        1.6s forwards;
}


.location-name {
    font-family:
        "aunt-mildred-mvb",
        sans-serif;

    font-weight: 400;

    font-style: italic;

    font-size:
        clamp(
            2rem,
            3.2vw,
            3.5rem
        );

    line-height: 1;

    letter-spacing: .08em;

    font-variant-caps:
        small-caps;

    font-feature-settings:
        "smcp" 1;

    text-shadow:
        0 2px 14px
        rgba(0,0,0,.20);

    margin-bottom: 8px;
}


.location-state {
    font-family:
        "legitima",
        serif;

    font-weight: 500;

    font-style: normal;

    font-size:
        clamp(
            .75rem,
            1vw,
            1rem
        );

    letter-spacing: .18em;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.20);
}


/* =========================================================
   VIMEO MODAL
   ========================================================= */

.video-modal {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px;

    background:
        rgba(0,0,0,.92);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}


.video-modal.active {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.video-container {
    position: relative;

    width:
        min(
            1200px,
            90vw
        );

    aspect-ratio: 16 / 9;

    background: #000;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.55);

    transform:
        scale(.96);

    transition:
        transform .6s ease;
}


.video-container iframe {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
}


.close-video {
    position: fixed;

    top: 28px;

    right: 32px;

    z-index: 11;

    width: 42px;

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius: 50%;

    background:
        rgba(0,0,0,.15);

    color: white;

    font-family:
        Arial,
        sans-serif;

    font-size: 25px;

    font-weight: 200;

    line-height: 1;

    cursor: pointer;

    transition:
        background .3s ease,
        border-color .3s ease,
        transform .3s ease;
}


.close-video:hover {
    background:
        rgba(255,255,255,.15);

    border-color:
        rgba(255,255,255,.9);

    transform:
        rotate(90deg);
}


.video-modal.active
.video-container {
    transform:
        scale(1);
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes videoFadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes mobileFadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes contentFadeIn {

    from {
        opacity: 0;

        transform:
            translate(
                -50%,
                calc(-50% + 15px)
            );
    }

    to {
        opacity: 1;

        transform:
            translate(
                -50%,
                -50%
            );
    }

}


@keyframes locationFadeIn {

    from {
        opacity: 0;

        transform:
            translate(
                -50%,
                10px
            );
    }

    to {
        opacity: 1;

        transform:
            translate(
                -50%,
                0
            );
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .content {
        top: 47%;
        width: 92%;
    }


    .names {
        font-size:
            clamp(
                3.1rem,
                13vw,
                4.5rem
            );

        margin-bottom: 16px;

        text-shadow:
            0 2px 14px
            rgba(0,0,0,.22);
    }


    .date {
        font-size: .9rem;

        letter-spacing: .14em;

        margin-bottom: 32px;
    }


    .buttons {
        gap: 12px;
    }


    .button {
        width:
            min(
                330px,
                90vw
            );

        padding:
            13px 18px;

        font-size: .78rem;

        white-space: nowrap;
    }


    .location {
        bottom: 5%;
    }


    .location-name {
        font-size:
            clamp(
                1.8rem,
                8vw,
                2.5rem
            );

        letter-spacing: .06em;

        margin-bottom: 6px;
    }


    .location-state {
        font-size: .7rem;

        letter-spacing: .16em;
    }


    .video-modal {
        padding: 20px;
    }


    .video-container {
        width: 94vw;

        aspect-ratio: 16 / 9;
    }


    .close-video {
        top: 18px;

        right: 18px;

        width: 38px;

        height: 38px;

        font-size: 22px;
    }

}


/* =========================================================
   SHORT MOBILE SCREENS
   ========================================================= */

@media (max-height: 700px)
and (max-width: 700px) {

    .content {
        top: 46%;
    }


    .names {
        font-size: 3rem;

        margin-bottom: 12px;
    }


    .date {
        margin-bottom: 24px;
    }


    .location {
        bottom: 4%;
    }

}

</style>

</head>


<body>


<main class="hero">


    <!-- =====================================================
         BACKGROUND VIDEO

         This is ALWAYS the preferred background.

         If Safari allows autoplay, this plays.

         If Safari rejects autoplay, JavaScript switches
         to the animated WebP below.
         ===================================================== -->

    <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
    >

        <source
            src="anna-and-mitch-background-1080p-web.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =====================================================
         MOBILE WEBP FALLBACK

         The source is intentionally stored in data-src
         so the WebP is NOT downloaded unless the MP4
         autoplay fails.
         ===================================================== -->

    <img
        class="mobile-background"
        data-src="anna-and-mitch-background-mobile-480x854.webp"
        alt=""
    >


    <!-- =====================================================
         CINEMATIC OVERLAY
         ===================================================== -->

    <div class="overlay"></div>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <section class="content">


        <h1 class="names">
            Anna and Mitch
        </h1>


        <div class="date">
            September 26, 2027
        </div>


        <div class="buttons">


            <a
                href="#"
                class="button"
                id="watch-video"
            >
                Watch Our Save the Date Video
            </a>


            <a
                href="https://www.zola.com/wedding/annaandmitch926"
                class="button"
                target="_blank"
                rel="noopener noreferrer"
            >
                Enter Website
            </a>


        </div>


    </section>


    <!-- =====================================================
         LOCATION
         ===================================================== -->

    <section class="location">


        <div class="location-name">
            Estes Park
        </div>


        <div class="location-state">
            COLORADO
        </div>


    </section>


</main>


<!-- =========================================================
     VIMEO VIDEO MODAL
     ========================================================= -->

<div
    class="video-modal"
    id="video-modal"
    aria-hidden="true"
>


    <button
        class="close-video"
        id="close-video"
        aria-label="Close video"
    >
        ×
    </button>


    <div class="video-container">


        <iframe
            id="vimeo-player"
            src=""
            title="Anna and Mitch Save the Date"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
        ></iframe>


    </div>


</div>


<script>


/* =========================================================
   ELEMENTS
   ========================================================= */

const backgroundVideo =
    document.querySelector(
        ".hero-video"
    );


const mobileBackground =
    document.querySelector(
        ".mobile-background"
    );


const watchVideo =
    document.getElementById(
        "watch-video"
    );


const videoModal =
    document.getElementById(
        "video-modal"
    );


const closeVideo =
    document.getElementById(
        "close-video"
    );


const vimeoPlayer =
    document.getElementById(
        "vimeo-player"
    );


/* =========================================================
   VIMEO URL
   ========================================================= */

const vimeoURL =
    "https://player.vimeo.com/video/1225371197?h=0adab949d5&autoplay=1&title=0&byline=0&portrait=0&dnt=1";


/* =========================================================
   MOBILE FALLBACK
   ========================================================= */

function switchToMobileFallback() {

    /*
       Don't do anything if the fallback
       is already active.
    */

    if (
        mobileBackground.style.display === "block"
    ) {
        return;
    }


    /*
       Load the WebP only now.

       This means users whose MP4 works
       never have to download the WebP.
    */

    const fallbackSource =
        mobileBackground.dataset.src;


    mobileBackground.src =
        fallbackSource;


    /*
       Hide the failed video.
    */

    backgroundVideo.style.display =
        "none";


    /*
       Show the animated WebP.
    */

    mobileBackground.style.display =
        "block";

}


/* =========================================================
   TRY TO PLAY THE NORMAL VIDEO
   ========================================================= */

function tryBackgroundVideo() {

    /*
       Ask Safari to actually start playback.

       In normal conditions this Promise resolves.

       In iOS Low Power Mode, Safari can reject
       the request because autoplay is disabled.
    */

    const playPromise =
        backgroundVideo.play();


    if (
        playPromise !== undefined
    ) {

        playPromise.catch(
            function() {

                /*
                   Autoplay failed.

                   Use the animated WebP instead.
                */

                switchToMobileFallback();

            }
        );

    }

}


/* =========================================================
   START BACKGROUND
   ========================================================= */

if (
    backgroundVideo.readyState >= 2
) {

    tryBackgroundVideo();

} else {

    backgroundVideo.addEventListener(
        "canplay",
        tryBackgroundVideo,
        {
            once: true
        }
    );

}


/* =========================================================
   OPEN VIMEO
   ========================================================= */

watchVideo.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        /*
           Pause the MP4 if it's playing.
        */

        if (
            backgroundVideo.style.display !== "none"
        ) {

            backgroundVideo.pause();

        }


        /*
           The WebP fallback cannot be paused
           like a video, so temporarily hide it.
        */

        if (
            mobileBackground.style.display === "block"
        ) {

            mobileBackground.style.visibility =
                "hidden";

        }


        /*
           Load Vimeo.
        */

        vimeoPlayer.src =
            vimeoURL;


        videoModal.classList.add(
            "active"
        );


        videoModal.setAttribute(
            "aria-hidden",
            "false"
        );

    }
);


/* =========================================================
   CLOSE VIMEO
   ========================================================= */

function closeVideoModal() {


    videoModal.classList.remove(
        "active"
    );


    videoModal.setAttribute(
        "aria-hidden",
        "true"
    );


    /*
       Stop Vimeo completely.
    */

    vimeoPlayer.src = "";


    /*
       If the WebP fallback is active,
       show it again.
    */

    if (
        mobileBackground.style.display === "block"
    ) {

        mobileBackground.style.visibility =
            "visible";

        return;

    }


    /*
       Otherwise resume the normal
       background MP4.
    */

    backgroundVideo
        .play()
        .catch(
            function() {

                /*
                   If playback somehow becomes
                   unavailable, use the fallback.
                */

                switchToMobileFallback();

            }
        );

}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

closeVideo.addEventListener(
    "click",
    closeVideoModal
);


/* =========================================================
   CLICK OUTSIDE VIDEO
   ========================================================= */

videoModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === videoModal
        ) {

            closeVideoModal();

        }

    }
);


/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            videoModal.classList.contains(
                "active"
            )
        ) {

            closeVideoModal();

        }

    }
);


</script>


</body>

</html>
