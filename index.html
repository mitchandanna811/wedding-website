<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Anna & Mitch</title>

  <!-- Adobe Fonts -->
  <link rel="stylesheet" href="https://use.typekit.net/anp5gec.css">

  <!-- Vimeo Player SDK -->
  <script src="https://player.vimeo.com/api/player.js"></script>

  <style>

    /* =========================
       BASIC RESET
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: legitima, serif;
    }


    /* =========================
       BACKGROUND VIDEO
    ========================= */

    .hero-video,
    .mobile-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }

    .mobile-background {
      display: none;
    }


    /* =========================
       DARK CINEMATIC OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.20);
      pointer-events: none;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
      color: #fff;

      animation: fadeIn 1.8s ease-out both;
    }


    /* =========================
       NAMES
    ========================= */

    .names {
      margin: 0;

      font-family: "aunt-mildred-mvb", sans-serif;
      font-weight: 400;
      font-style: normal;

      font-size: clamp(64px, 10vw, 150px);
      line-height: 0.9;

      letter-spacing: -0.02em;

      text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.25);
    }


    /* =========================
       DATE
    ========================= */

    .date {
      margin-top: 24px;

      font-family: legitima, serif;
      font-weight: 500;
      font-style: normal;

      font-size: clamp(19px, 2.1vw, 28px);
      letter-spacing: 0.08em;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 14px;

      margin-top: 38px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 280px;

      padding: 13px 24px;

      border: 1px solid rgba(255, 255, 255, 0.75);

      background: rgba(0, 0, 0, 0.08);

      color: #fff;

      font-family: legitima, serif;
      font-weight: 500;
      font-style: normal;

      font-size: 17px;
      letter-spacing: 0.04em;

      text-decoration: none;

      cursor: pointer;

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;

      white-space: nowrap;

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 1);
      transform: translateY(-2px);
    }

    .button:active {
      transform: translateY(0);
    }


    /* =========================
       LOCATION
    ========================= */

    .location {
      position: absolute;

      bottom: 28px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      color: #fff;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .location-main {
      font-family: "aunt-mildred-mvb", sans-serif;
      font-weight: 400;
      font-style: italic;

      font-variant-caps: small-caps;
      font-feature-settings: "smcp" 1;

      font-size: 25px;
      line-height: 1;
    }

    .location-state {
      margin-top: 5px;

      font-family: legitima, serif;
      font-weight: 500;
      font-style: normal;

      font-size: 11px;
      letter-spacing: 0.28em;
    }


    /* =========================
       VIDEO MODAL
    ========================= */

    .video-modal {
      position: fixed;
      inset: 0;

      z-index: 10;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.94);

      padding: 30px;
    }

    .video-modal.active {
      display: flex;
    }


    /* =========================
       VIDEO CONTAINER
    ========================= */

    .video-container {
      position: relative;

      width: min(92vw, 1200px);
      aspect-ratio: 16 / 9;

      background: #000;

      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.55);
    }


    /* =========================
       VIMEO IFRAME
    ========================= */

    .video-container iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .close-video {
      position: absolute;

      top: -48px;
      right: 0;

      width: 38px;
      height: 38px;

      border: 0;
      background: transparent;

      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 30px;
      font-weight: 200;
      line-height: 1;

      cursor: pointer;

      opacity: 0.85;

      z-index: 20;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .close-video:hover {
      opacity: 1;
      transform: scale(1.08);
    }


    /* =========================
       CUSTOM FULLSCREEN BUTTON
    ========================= */

    .fullscreen-video {
      position: absolute;

      top: 16px;
      right: 16px;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.28);

      color: #fff;

      cursor: pointer;

      z-index: 20;

      opacity: 0.9;

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .fullscreen-video:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 1);
      transform: scale(1.05);
      opacity: 1;
    }

    .fullscreen-video svg {
      width: 18px;
      height: 18px;

      fill: none;

      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .overlay {
        background: rgba(0, 0, 0, 0.18);
      }

      .content {
        padding:
          30px
          20px
          70px;
      }

      .names {
        font-size: clamp(56px, 17vw, 90px);
      }

      .date {
        margin-top: 20px;
        font-size: 19px;
      }

      .buttons {
        margin-top: 34px;
        gap: 12px;
      }

      .button {
        min-width: 270px;
        padding: 12px 18px;
        font-size: 16px;
      }

      .location {
        bottom: 23px;
      }

      .location-main {
        font-size: 22px;
      }

      .location-state {
        font-size: 10px;
      }


      /* Video modal on phones */

      .video-modal {
        padding: 16px;
      }

      .video-container {
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      .close-video {
        top: -46px;
        right: -2px;
      }

      .fullscreen-video {
        top: 12px;
        right: 12px;

        width: 40px;
        height: 40px;
      }
    }


    /* =========================
       FADE IN
    ========================= */

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       BACKGROUND
  ========================= -->

  <video
    class="hero-video"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>

  <img
    class="mobile-background"
    alt=""
  >

  <div class="overlay"></div>


  <!-- =========================
       MAIN CONTENT
  ========================= -->

  <main class="content">

    <h1 class="names">
      Anna and Mitch
    </h1>

    <div class="date">
      September 26, 2027
    </div>

    <div class="buttons">

      <button
        class="button"
        id="watch-video"
        type="button"
      >
        Watch Our Save the Date Video
      </button>

      <a
        class="button"
        href="https://www.zola.com/wedding/annaandmitch926"
        target="_blank"
        rel="noopener noreferrer"
      >
        Enter Website
      </a>

    </div>


    <div class="location">

      <div class="location-main">
        Estes Park
      </div>

      <div class="location-state">
        COLORADO
      </div>

    </div>

  </main>


  <!-- =========================
       VIDEO MODAL
  ========================= -->

  <div
    class="video-modal"
    id="video-modal"
    aria-hidden="true"
  >

    <div class="video-container">

      <!-- Close -->
      <button
        class="close-video"
        id="close-video"
        type="button"
        aria-label="Close video"
      >
        ×
      </button>


      <!-- Custom fullscreen -->
      <button
        class="fullscreen-video"
        id="fullscreen-video"
        type="button"
        aria-label="Enter fullscreen"
        title="Fullscreen"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3 9V3h6"></path>
          <path d="M15 3h6v6"></path>
          <path d="M21 15v6h-6"></path>
          <path d="M9 21H3v-6"></path>
        </svg>

      </button>


      <!-- Vimeo -->
      <iframe
        id="vimeo-player"
        title="Anna and Mitch Save the Date"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
      ></iframe>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       BACKGROUND VIDEO
    ========================= */

    const backgroundVideo =
      document.querySelector(".hero-video");

    const mobileBackground =
      document.querySelector(".mobile-background");

    const isMobile =
      window.matchMedia("(max-width: 700px)").matches;

    const desktopVideo =
      "anna-and-mitch-background-1080p-web.mp4";

    const mobileVideo =
      "anna-and-mitch-background-mobile-1080x1920.mp4";

    const mobileWebP =
      "anna-and-mitch-background-mobile-480x854.webp";


    if (isMobile) {
      backgroundVideo.src = mobileVideo;
    } else {
      backgroundVideo.src = desktopVideo;
    }


    function switchToMobileFallback() {

      if (!isMobile) return;

      if (mobileBackground.style.display === "block") {
        return;
      }

      mobileBackground.src = mobileWebP;

      backgroundVideo.style.display = "none";

      mobileBackground.style.display = "block";
    }


    function tryBackgroundVideo() {

      const playPromise =
        backgroundVideo.play();

      if (playPromise !== undefined) {

        playPromise.catch(function() {

          switchToMobileFallback();

        });

      }

    }


    if (backgroundVideo.readyState >= 2) {

      tryBackgroundVideo();

    } else {

      backgroundVideo.addEventListener(
        "canplay",
        tryBackgroundVideo,
        { once: true }
      );

    }


    /* =========================
       VIMEO
    ========================= */

    const videoModal =
      document.getElementById("video-modal");

    const watchVideo =
      document.getElementById("watch-video");

    const closeVideo =
      document.getElementById("close-video");

    const fullscreenVideo =
      document.getElementById("fullscreen-video");

    const vimeoIframe =
      document.getElementById("vimeo-player");


    /*
      Simplified Vimeo player.

      IMPORTANT:
      No fullscreen=1.

      cc=0 tells Vimeo not to enable
      the closed-caption control where
      the parameter is supported.
    */

    const vimeoURL =
      "https://player.vimeo.com/video/1225371197?h=0adab949d5&autoplay=1&title=0&byline=0&portrait=0&dnt=1&cc=0";


    let vimeoPlayer = null;


    /* =========================
       OPEN VIDEO
    ========================= */

    watchVideo.addEventListener("click", function() {

      /* Pause background */

      if (
        backgroundVideo.style.display !== "none" &&
        !backgroundVideo.paused
      ) {
        backgroundVideo.pause();
      }


      /* Hide fallback */

      if (
        mobileBackground.style.display === "block"
      ) {
        mobileBackground.style.display = "none";
      }


      /* Load Vimeo */

      vimeoIframe.src = vimeoURL;


      /* Show modal */

      videoModal.classList.add("active");

      videoModal.setAttribute(
        "aria-hidden",
        "false"
      );


      /* Create Vimeo Player */

      vimeoPlayer =
        new Vimeo.Player(vimeoIframe);


      /* Start playback */

      vimeoPlayer.ready().then(function() {

        vimeoPlayer.play().catch(function() {
          /* Browser may require manual play */
        });

      });

    });


    /* =========================
       CUSTOM FULLSCREEN
    ========================= */

    fullscreenVideo.addEventListener(
      "click",
      function() {

        if (!vimeoPlayer) return;

        vimeoPlayer
          .getFullscreen()
          .then(function(isFullscreen) {

            if (isFullscreen) {

              return vimeoPlayer.exitFullscreen();

            } else {

              return vimeoPlayer.requestFullscreen();

            }

          })
          .catch(function(error) {

            console.log(
              "Fullscreen unavailable:",
              error
            );

          });

      }
    );


    /* =========================
       CLOSE VIDEO
    ========================= */

    function closeVideoModal() {

      /* Stop Vimeo */

      if (vimeoPlayer) {

        vimeoPlayer.pause().catch(function() {});

      }


      /* Remove Vimeo */

      vimeoIframe.src = "";


      /* Destroy Vimeo API */

      if (vimeoPlayer) {

        vimeoPlayer.destroy().catch(function() {});

        vimeoPlayer = null;

      }


      /* Hide modal */

      videoModal.classList.remove("active");

      videoModal.setAttribute(
        "aria-hidden",
        "true"
      );


      /* Restore background */

      if (isMobile) {

        if (
          backgroundVideo.style.display === "none"
        ) {

          /*
            We were using the WebP fallback.
          */

          mobileBackground.style.display =
            "block";

        } else {

          backgroundVideo.style.display =
            "block";

          backgroundVideo.play().catch(function() {});

        }

      } else {

        backgroundVideo.style.display =
          "block";

        backgroundVideo.play().catch(function() {});

      }

    }


    closeVideo.addEventListener(
      "click",
      closeVideoModal
    );


    /* =========================
       CLICK OUTSIDE VIDEO
    ========================= */

    videoModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target === videoModal
        ) {

          closeVideoModal();

        }

      }
    );


    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          videoModal.classList.contains("active")
        ) {

          closeVideoModal();

        }

      }
    );

  </script>

</body>
</html>
