<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anna and Mitch</title>

    <!-- Adobe Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/anp5gec.css">

    <style>

        /* -----------------------------------------
           BASIC PAGE SETUP
        ----------------------------------------- */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
        }


        /* -----------------------------------------
           FULL SCREEN VIDEO
        ----------------------------------------- */

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            background: #000;
        }

        .hero-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            opacity: 0;

            animation: videoFadeIn 2.5s ease forwards;
        }


        /* -----------------------------------------
           CINEMATIC DARKENING
        ----------------------------------------- */

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.12) 0%,
                    rgba(0, 0, 0, 0.08) 45%,
                    rgba(0, 0, 0, 0.20) 100%
                );

            z-index: 1;

            pointer-events: none;
        }


        /* -----------------------------------------
           CONTENT
        ----------------------------------------- */

        .content {
            position: absolute;
            z-index: 2;

            left: 50%;
            top: 48%;

            transform: translate(-50%, -50%);

            width: 90%;

            text-align: center;

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;

            opacity: 0;

            animation:
                contentFadeIn 1.8s ease 1.2s forwards;
        }


        /* -----------------------------------------
           NAMES
        ----------------------------------------- */

        .names {
            font-family: "aunt-mildred-mvb", sans-serif;

            font-weight: 400;
            font-style: normal;

            font-size: clamp(3.5rem, 6vw, 6.5rem);

            line-height: 1;

            letter-spacing: 0.01em;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.35);

            margin-bottom: 20px;
        }


        /* -----------------------------------------
           DATE
        ----------------------------------------- */

        .date {
            font-family: "legitima", serif;

            font-weight: 500;
            font-style: normal;

            font-size: clamp(1rem, 1.35vw, 1.35rem);

            letter-spacing: 0.18em;

            text-transform: none;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.4);

            margin-bottom: 38px;
        }


        /* -----------------------------------------
           BUTTONS
        ----------------------------------------- */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .button {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 210px;

            padding: 13px 24px;

            color: white;

            text-decoration: none;

            font-family: "legitima", serif;

            font-weight: 500;
            font-style: normal;

            font-size: 0.82rem;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            border: 1px solid rgba(255, 255, 255, 0.65);

            background: rgba(0, 0, 0, 0.08);

            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);

            transition:
                background 0.4s ease,
                border-color 0.4s ease,
                transform 0.4s ease;
        }


        /* Elegant animated line */

        .button::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: -1px;

            width: 0;
            height: 1px;

            background: white;

            transform: translateX(-50%);

            transition: width 0.4s ease;
        }


        /* Hover */

        .button:hover {
            background: rgba(255, 255, 255, 0.13);

            border-color: rgba(255, 255, 255, 0.95);

            transform: translateY(-2px);
        }

        .button:hover::after {
            width: 70%;
        }


        /* -----------------------------------------
           ANIMATIONS
        ----------------------------------------- */

        @keyframes videoFadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        @keyframes contentFadeIn {

            from {
                opacity: 0;
                transform: translate(-50%, calc(-50% + 15px));
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }

        }


        /* -----------------------------------------
           MOBILE
        ----------------------------------------- */

        @media (max-width: 700px) {

            .hero-video {
                object-position: 50% center;
            }

            .overlay {
                background:
                    linear-gradient(
                        to bottom,
                        rgba(0, 0, 0, 0.15) 0%,
                        rgba(0, 0, 0, 0.08) 45%,
                        rgba(0, 0, 0, 0.25) 100%
                    );
            }

            .content {
                top: 47%;
                width: 92%;
            }

            .names {
                font-size: clamp(3.1rem, 13vw, 4.5rem);

                margin-bottom: 16px;
            }

            .date {
                font-size: 0.9rem;

                letter-spacing: 0.14em;

                margin-bottom: 32px;
            }

            .buttons {
                flex-direction: column;

                gap: 12px;

                width: 100%;
            }

            .button {
                width: min(300px, 90vw);

                min-width: 0;

                padding: 13px 18px;

                font-size: 0.78rem;
            }

        }


        /* -----------------------------------------
           VERY SMALL PHONES
        ----------------------------------------- */

        @media (max-height: 700px) and (max-width: 700px) {

            .content {
                top: 46%;
            }

            .names {
                font-size: 3rem;

                margin-bottom: 12px;
            }

            .date {
                margin-bottom: 24px;
            }

        }

    </style>
</head>


<body>

    <main class="hero">

        <!-- Background Video -->
        <video
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >
            <source src="wedding-video.mp4" type="video/mp4">
        </video>


        <!-- Cinematic Darkening -->
        <div class="overlay"></div>


        <!-- Wedding Information -->
        <section class="content">

            <h1 class="names">
                Anna and Mitch
            </h1>


            <div class="date">
                September 26, 2027
            </div>


            <div class="buttons">

                <!-- Save the Date -->
                <a
                    class="button"
                    href="https://vimeo.com/1224715561/3b9908be69?share=copy&fl=sv&fe=ci"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Watch our Save the Date video
                </a>


                <!-- Wedding Website -->
                <a
                    class="button"
                    href="https://www.zola.com/wedding/annaandmitch926"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Enter Website
                </a>

            </div>

        </section>

    </main>

</body>
</html>
