<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anna And Mitch</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            transform: translate(-50%, -50%);

            object-fit: cover;

            z-index: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;

            background: rgba(0,0,0,0.25);

            z-index: 2;
        }

        .content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            color: white;

            z-index: 3;
        }

        .names {
            font-size: clamp(40px, 6vw, 80px);
            font-weight: normal;
            letter-spacing: 3px;

            margin-bottom: 12px;
        }

        .date {
            font-size: 18px;
            letter-spacing: 4px;

            margin-bottom: 45px;
        }

        .enter-button {
            display: inline-block;

            padding: 16px 34px;

            border: 1px solid white;

            color: white;
            text-decoration: none;

            font-size: 14px;
            letter-spacing: 3px;

            transition: all 0.3s ease;

            background: rgba(0,0,0,0.15);
        }

        .enter-button:hover {
            background: white;
            color: black;
        }

    </style>
</head>

<body>

<div class="hero">

    <video
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source src="wedding-video.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>

    <div class="content">

        <div class="names">
            Mitchell & Anna
        </div>

        <div class="date">
            September 26, 2027
        </div>

        <a
            class="enter-button"
            href="https://www.zola.com/wedding/annaandmitch926">

            ENTER SITE

        </a>

    </div>

</div>

</body>
</html>
