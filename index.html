<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anna and Mitch</title>


    <!-- =========================================
         ADOBE FONTS
    ========================================== -->

    <link rel="stylesheet" href="https://use.typekit.net/anp5gec.css">


    <style>

        /* =========================================
           BASIC PAGE SETUP
        ========================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {
            background: #000;
        }



        /* =========================================
           HERO
        ========================================== */

        .hero {

            position: relative;

            width: 100vw;

            height: 100vh;
            height: 100svh;

            overflow: hidden;

            background: #000;
        }



        /* =========================================
           BACKGROUND VIDEO
        ========================================== */

        .hero-video {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center center;

            opacity: 0;

            animation: videoFadeIn 2.5s ease forwards;
        }



        /* =========================================
           CINEMATIC DARKENING
        ========================================== */

        .overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.12) 0%,
                    rgba(0, 0, 0, 0.07) 45%,
                    rgba(0, 0, 0, 0.20) 100%
                );

            z-index: 1;

            pointer-events: none;
        }



        /* =========================================
           MAIN CONTENT
        ========================================== */

        .content {

            position: absolute;

            z-index: 2;

            left: 50%;
            top: 48%;

            transform: translate(-50%, -50%);

            width: 90%;

            text-align: center;

            color: white;

            display: flex;

            flex-direction: column;

            align-items: center;

            opacity: 0;

            animation:
                contentFadeIn 1.8s ease 1.2s forwards;
        }



        /* =========================================
           NAMES
        ========================================== */

        .names {

            font-family: "aunt-mildred-mvb", sans-serif;

            font-weight: 400;

            font-style: normal;

            font-size:
                clamp(
                    3.5rem,
                    6vw,
                    6.5rem
                );

            line-height: 1;

            letter-spacing: 0.01em;

            text-shadow:
                0 2px 16px rgba(0, 0, 0, 0.22);

            margin-bottom: 20px;
        }



        /* =========================================
           DATE
        ========================================== */

        .date {

            font-family: "legitima", serif;

            font-weight: 500;

            font-style: normal;

            font-size:
                clamp(
                    1rem,
                    1.35vw,
                    1.35rem
                );

            letter-spacing: 0.18em;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.22);

            margin-bottom: 38px;
        }



        /* =========================================
           BUTTONS
        ========================================== */

        .buttons {

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 13px;

            width: 100%;
        }



        /* =========================================
           INDIVIDUAL BUTTON
        ========================================== */

        .button {

            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 330px;

            padding: 13px 22px;

            color: white;

            text-decoration: none;

            font-family: "legitima", serif;

            font-weight: 500;

            font-style: normal;

            font-size: 0.82rem;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            text-align: center;

            white-space: nowrap;

            border:
                1px solid
                rgba(255, 255, 255, 0.65);

            background:
                rgba(0, 0, 0, 0.08);

            backdrop-filter: blur(2px);

            -webkit-backdrop-filter: blur(2px);

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.20);

            transition:
                background 0.4s ease,
                border-color 0.4s ease,
                transform 0.4s ease;
        }



        /* =========================================
           BUTTON UNDERLINE
        ========================================== */

        .button::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -1px;

            width: 0;

            height: 1px;

            background: white;

            transform:
                translateX(-50%);

            transition:
                width 0.4s ease;
        }



        /* =========================================
           BUTTON HOVER
        ========================================== */

        .button:hover {

            background:
                rgba(255, 255, 255, 0.13);

            border-color:
                rgba(255, 255, 255, 0.95);

            transform:
                translateY(-2px);
        }


        .button:hover::after {

            width: 70%;
        }



        /* =========================================
           VIDEO MODAL
        ========================================== */

        .video-modal {

            position: fixed;

            inset: 0;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px;

            background:
                rgba(0, 0, 0, 0.92);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }



        /* =========================================
           ACTIVE VIDEO MODAL
        ========================================== */

        .video-modal.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }



        /* =========================================
           VIMEO VIDEO CONTAINER
        ========================================== */

        .video-container {

            position: relative;

            width:
                min(
                    1200px,
                    90vw
                );

            aspect-ratio: 16 / 9;

            background: #000;

            box-shadow:
                0 20px 80px
                rgba(0, 0, 0, 0.55);

            transform:
                scale(0.96);

            transition:
                transform 0.6s ease;
        }



        /* =========================================
           VIMEO IFRAME
        ========================================== */

        .video-container iframe {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border: 0;
        }



        /* =========================================
           CLOSE BUTTON
        ========================================== */

        .close-video {

            position: fixed;

            top: 28px;

            right: 32px;

            z-index: 11;

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.55);

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.15);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 25px;

            font-weight: 200;

            line-height: 1;

            cursor: pointer;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }



        /* =========================================
           CLOSE BUTTON HOVER
        ========================================== */

        .close-video:hover {

            background:
                rgba(255, 255, 255, 0.15);

            border-color:
                rgba(255, 255, 255, 0.9);

            transform:
                rotate(90deg);
        }



        /* =========================================
           VIDEO OPEN ANIMATION
        ========================================== */

        .video-modal.active
        .video-container {

            transform:
                scale(1);
        }



        /* =========================================
           PAGE ANIMATIONS
        ========================================== */

        @keyframes videoFadeIn {

            from {

                opacity: 0;
            }

            to {

                opacity: 1;
            }
        }


        @keyframes contentFadeIn {

            from {

                opacity: 0;

                transform:
                    translate(
                        -50%,
                        calc(-50% + 15px)
                    );
            }

            to {

                opacity: 1;

                transform:
                    translate(
                        -50%,
                        -50%
                    );
            }
        }



        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {


            .hero-video {

                object-position:
                    50% center;
            }


            .overlay {

                background:
                    linear-gradient(
                        to bottom,
                        rgba(0, 0, 0, 0.15) 0%,
                        rgba(0, 0, 0, 0.08) 45%,
                        rgba(0, 0, 0, 0.25) 100%
                    );
            }


            .content {

                top: 47%;

                width: 92%;
            }


            .names {

                font-size:
                    clamp(
                        3.1rem,
                        13vw,
                        4.5rem
                    );

                margin-bottom: 16px;

                text-shadow:
                    0 2px 14px
                    rgba(0, 0, 0, 0.22);
            }


            .date {

                font-size: 0.9rem;

                letter-spacing: 0.14em;

                margin-bottom: 32px;
            }


            .buttons {

                gap: 12px;
            }


            .button {

                width:
                    min(
                        330px,
                        90vw
                    );

                padding:
                    13px 18px;

                font-size: 0.78rem;

                white-space: nowrap;
            }



            /* -------------------------------------
               MOBILE VIDEO MODAL
            ------------------------------------- */

            .video-modal {

                padding: 20px;
            }


            .video-container {

                width: 94vw;

                aspect-ratio: 16 / 9;
            }


            .close-video {

                top: 18px;

                right: 18px;

                width: 38px;

                height: 38px;

                font-size: 22px;
            }

        }



        /* =========================================
           SMALL / SHORT PHONES
        ========================================== */

        @media
        (max-height: 700px)
        and
        (max-width: 700px) {


            .content {

                top: 46%;
            }


            .names {

                font-size: 3rem;

                margin-bottom: 12px;
            }


            .date {

                margin-bottom: 24px;
            }

        }

    </style>

</head>



<body>


    <!-- =========================================
         HERO PAGE
    ========================================== -->

    <main class="hero">


        <!-- =====================================
             NEW 1080P LOOPING BACKGROUND VIDEO
        ====================================== -->

        <video
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="anna-and-mitch-background-1080p-web.mp4"
                type="video/mp4"
            >

        </video>



        <!-- =====================================
             HERO DARKENING
        ====================================== -->

        <div class="overlay"></div>



        <!-- =====================================
             WEDDING INFORMATION
        ====================================== -->

        <section class="content">


            <!-- NAMES -->

            <h1 class="names">

                Anna and Mitch

            </h1>



            <!-- DATE -->

            <div class="date">

                September 26, 2027

            </div>



            <!-- =================================
                 BUTTONS
            ================================== -->

            <div class="buttons">


                <!-- SAVE THE DATE -->

                <a
                    href="#"
                    class="button"
                    id="watch-video"
                >

                    Watch Our Save the Date Video

                </a>



                <!-- ZOLA WEBSITE -->

                <a
                    href="https://www.zola.com/wedding/annaandmitch926"
                    class="button"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    Enter Website

                </a>


            </div>

        </section>

    </main>



    <!-- =========================================
         CINEMATIC VIMEO VIDEO MODAL
    ========================================== -->

    <div
        class="video-modal"
        id="video-modal"
        aria-hidden="true"
    >


        <!-- =====================================
             CLOSE BUTTON
        ====================================== -->

        <button
            class="close-video"
            id="close-video"
            aria-label="Close video"
        >

            ×

        </button>



        <!-- =====================================
             VIDEO CONTAINER
        ====================================== -->

        <div class="video-container">


            <iframe
                id="vimeo-player"
                src=""
                title="Anna and Mitch Save the Date"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
            >

            </iframe>


        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* =========================================
           GET PAGE ELEMENTS
        ========================================== */

        const watchVideo =
            document.getElementById(
                "watch-video"
            );


        const videoModal =
            document.getElementById(
                "video-modal"
            );


        const closeVideo =
            document.getElementById(
                "close-video"
            );


        const vimeoPlayer =
            document.getElementById(
                "vimeo-player"
            );


        /*
         * This is your background hero video.
         */

        const backgroundVideo =
            document.querySelector(
                ".hero-video"
            );



        /* =========================================
           NEW VIMEO VIDEO URL
        ========================================== */

        const vimeoURL =
            "https://player.vimeo.com/video/1225371197?h=0adab949d5&autoplay=1&title=0&byline=0&portrait=0&dnt=1";



        /* =========================================
           OPEN VIMEO VIDEO
        ========================================== */

        watchVideo.addEventListener(
            "click",
            function(event) {


                /*
                 * Prevent the button from
                 * jumping to the top of the page.
                 */

                event.preventDefault();



                /*
                 * =================================
                 * PAUSE BACKGROUND VIDEO
                 * =================================
                 */

                backgroundVideo.pause();



                /*
                 * =================================
                 * LOAD NEW VIMEO VIDEO
                 * =================================
                 */

                vimeoPlayer.src =
                    vimeoURL;



                /*
                 * =================================
                 * SHOW VIDEO MODAL
                 * =================================
                 */

                videoModal.classList.add(
                    "active"
                );


                videoModal.setAttribute(
                    "aria-hidden",
                    "false"
                );

            }
        );



        /* =========================================
           CLOSE VIMEO VIDEO
        ========================================== */

        function closeVideoModal() {


            /*
             * =================================
             * HIDE VIDEO MODAL
             * =================================
             */

            videoModal.classList.remove(
                "active"
            );


            videoModal.setAttribute(
                "aria-hidden",
                "true"
            );



            /*
             * =================================
             * STOP VIMEO VIDEO
             * =================================
             */

            vimeoPlayer.src = "";



            /*
             * =================================
             * RESUME BACKGROUND VIDEO
             * =================================
             */

            backgroundVideo.play();

        }



        /* =========================================
           CLOSE BUTTON
        ========================================== */

        closeVideo.addEventListener(
            "click",
            closeVideoModal
        );



        /* =========================================
           CLICK OUTSIDE VIDEO
        ========================================== */

        videoModal.addEventListener(
            "click",
            function(event) {


                if (
                    event.target ===
                    videoModal
                ) {

                    closeVideoModal();

                }

            }
        );



        /* =========================================
           ESC KEY
        ========================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key === "Escape" &&
                    videoModal.classList.contains(
                        "active"
                    )
                ) {

                    closeVideoModal();

                }

            }
        );


    </script>


</body>

</html>
